# MailMate — Cargo workspace.
#
# Hexagonal layering (mirrors github.com/nick-tgcs/idiolect):
#   mailmate-common      — backend-free shared value types (the leaf).
#   mailmate-ports       — port traits; depends only on -common.
#   mailmate-core        — domain + use-cases; depends ONLY on -ports + -common.
#   mailmate-test-support— in-memory fakes + fixtures implementing the ports.
#   mailmate-core-tests  — core's behavioural tests (kept OUT of -core so -core
#                          has zero dev-dependency path to any backend).
#   mailmate-arch-test   — inspects the workspace via `cargo metadata` from the
#                          OUTSIDE to enforce the no-backend-leakage law.
#
# The set of port traits grows phase by phase (Implementation Sequence): Phase 0
# ships the cross-cutting infrastructure ports only.
[workspace]
resolver = "2"
members = [
    "crates/mailmate-common",
    "crates/mailmate-ports",
    "crates/mailmate-core",
    "crates/mailmate-native-host",
    "crates/mailmate-storage",
    "crates/mailmate-policy",
    "crates/mailmate-rules",
    "crates/mailmate-ai",
    "crates/mailmate-ml",
    "crates/mailmate-planner",
    "crates/mailmate-learning",
    "crates/mailmate-training",
    "crates/mailmate-workflow",
    "crates/mailmate-test-support",
    "crates/mailmate-core-tests",
    "crates/mailmate-arch-test",
]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.96"

# Strict, warning-free hygiene — verbatim from idiolect. Every lint GROUP carries
# priority = -1 so individual lints can still override it (and so the table parses
# under clippy::lint_groups_priority). Each crate opts in with `[lints] workspace = true`.
[workspace.lints.rust]
warnings = "deny"
unsafe_code = "forbid"
rust_2018_idioms = { level = "deny", priority = -1 }
unused_lifetimes = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# Exact-pinned versions (enforced by ci/scripts/test-real-adapter-deps.sh). Resolved
# current as of 2026-06-14. No backend/runtime crate appears here that the core could
# reach: tokio is a dev-only async test executor; cargo_metadata is arch-test only.
[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.19"
async-trait = "=0.1.89"
futures = "=0.3.33"
time = { version = "=0.3.54", features = ["serde", "macros", "formatting", "parsing"] }
uuid = { version = "=1.23.5", features = ["v4", "serde"] }
tokio = { version = "=1.52.3", default-features = false, features = ["rt", "rt-multi-thread", "macros", "sync"] }
cargo_metadata = "=0.23.1"
# Embedded SQLite driver for the default storage backend. `bundled` statically compiles
# SQLite (no system library, single binary). Lives ONLY in the mailmate-storage adapter;
# the no-backend-leakage guard keeps it out of core/ports/common.
rusqlite = { version = "=0.40.1", features = ["bundled"] }
# RE2-style (linear-time, no ReDoS) regex backing the `matches_regex` rule operator. Pure
# Rust; lives in the mailmate-rules adapter, not the inner hexagon.
regex = "=1.13.0"
# TOML parser for the host's `[storage]`/`[ai]`/`[retention]` config file (Phase 12).
# Pure Rust, edge-only (the native-host composition root); never reaches the inner hexagon.
toml = "=1.1.3"
# Dev-only: hermetic temp files/dirs for the file-backed-storage and composition-root tests
# (declared here because Cargo inherits `<dep>.workspace = true` only from this table).
tempfile = "=3.27.0"
