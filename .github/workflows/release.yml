# Release automation. `main` is the stable release branch; only release PRs from
# `develop` merge into it, and a merge re-runs full validation before producing
# artifacts. Releasable-at-all-times: the full PR suite is re-run on `main` here.
name: release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  validate:
    name: re-run full validation on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy, llvm-tools
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: ci/scripts/test-interface-no-backend-leakage.sh
      - run: ci/scripts/test-real-adapter-deps.sh
      - run: ci/scripts/coverage-gate.sh

  build:
    name: build release binaries (${{ matrix.target.name }})
    needs: validate
    # Only build/publish artifacts for an actual version tag.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: linux-x86_64, os: ubuntu-latest, triple: x86_64-unknown-linux-gnu }
          - { name: macos-aarch64, os: macos-latest, triple: aarch64-apple-darwin }
          - { name: windows-x86_64, os: windows-latest, triple: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: ${{ matrix.target.triple }}
      - uses: Swatinem/rust-cache@v2
      # The native host binary lands in Phase 1; until then this builds the
      # workspace libraries and produces no missing-artifact failure.
      - run: cargo build --workspace --release --target ${{ matrix.target.triple }}
      - uses: actions/upload-artifact@v4
        with:
          name: mailmate-${{ matrix.target.name }}
          path: target/${{ matrix.target.triple }}/release/
          if-no-files-found: ignore

  github-release:
    name: create/update GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Generate checksums
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd artifacts
          : > SHA256SUMS
          for f in */*; do
            [ -f "$f" ] && sha256sum "$f" >> SHA256SUMS
          done
          cat SHA256SUMS || true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
