# Security and supply-chain checks: Rust dependency audit, secret-pattern scan,
# and license/unsafe flags. Runs on PRs and weekly.
name: security

on:
  pull_request:
    branches: [develop]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  cargo-audit:
    name: cargo audit (advisory DB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Report advisories; do not hard-fail the PR on yet-unpatched upstream
      # advisories (Dependabot drives the fix), but surface them loudly.
      - run: cargo audit || true
      - run: cargo audit --deny warnings
        continue-on-error: true

  cargo-deny:
    name: cargo deny (licenses, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check licenses bans sources advisories
        continue-on-error: true

  secret-scan:
    name: secret-pattern scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan tracked files for credential-like patterns
        run: |
          set -euo pipefail
          # High-signal patterns only, to keep this deterministic and false-positive
          # free. Test fixtures live under */tests/ and */fixtures/ and are exempt.
          patterns='(AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----|xox[baprs]-[0-9A-Za-z-]+|ghp_[0-9A-Za-z]{36})'
          if git ls-files \
               | grep -vE '(/tests/|/fixtures/|\.lock$)' \
               | xargs -r grep -EnI "${patterns}" ; then
            echo "POTENTIAL SECRET committed (above)."
            exit 1
          fi
          echo "No credential-like patterns found."
