[package]
name = "mailmate-native-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

# The native host is an EDGE adapter (outside the hexagon): it is allowed to know
# the wire format and serde, and — from Phase 10 — to depend on `mailmate-core`'s
# use-cases and the `mailmate-ports` traits so it can route protocol frames into the
# core. It still depends on NO backend (the no-backend-leakage guard scans only
# core/-ports/-common). The stdio framing here is the production adapter behind the
# `Transport` port; `ThunderbirdMailClient` is the production adapter behind the
# `MailClient` port. Concrete engines/storage are injected by the composition root
# (deferred to Phase 12 hardening); the router is tested here against the fakes.
[dependencies]
mailmate-common = { path = "../mailmate-common" }
mailmate-core = { path = "../mailmate-core" }
mailmate-ports = { path = "../mailmate-ports" }
async-trait = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
mailmate-test-support = { path = "../mailmate-test-support" }
# The real follow-up adapters (DefaultWorkflowEngine / DefaultFollowUpScheduler /
# DefaultExitDetector) wired over the in-memory fakes in the router's follow-up tests.
mailmate-workflow = { path = "../mailmate-workflow" }

[[bin]]
name = "mailmate-native-host"
path = "src/main.rs"

[lib]
name = "mailmate_native_host"
path = "src/lib.rs"
