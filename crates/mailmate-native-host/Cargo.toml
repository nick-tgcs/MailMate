[package]
name = "mailmate-native-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

# The native host is an EDGE adapter (outside the hexagon): it knows the wire format and
# serde, depends on `mailmate-core`'s use-cases and the `mailmate-ports` traits, and — from
# Phase 12 — is the **composition root** that injects the concrete adapters. So it depends on
# every adapter crate (storage / policy / rules / ai / ml / planner / learning / training /
# workflow). It is OUTSIDE the hexagon, so the no-backend-leakage guard (which scans only
# core/-ports/-common) is unaffected: it stays clean to wire `rusqlite`-backed storage here.
# The stdio framing is the production `Transport`; `ThunderbirdMailClient` the production
# `MailClient`; `runtime` assembles them with the real engines into a live `HostRouter`.
[dependencies]
mailmate-common = { path = "../mailmate-common" }
mailmate-core = { path = "../mailmate-core" }
mailmate-ports = { path = "../mailmate-ports" }
mailmate-storage = { path = "../mailmate-storage" }
mailmate-policy = { path = "../mailmate-policy" }
mailmate-rules = { path = "../mailmate-rules" }
mailmate-ai = { path = "../mailmate-ai" }
mailmate-ml = { path = "../mailmate-ml" }
mailmate-planner = { path = "../mailmate-planner" }
mailmate-learning = { path = "../mailmate-learning" }
mailmate-training = { path = "../mailmate-training" }
mailmate-workflow = { path = "../mailmate-workflow" }
async-trait = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
mailmate-test-support = { path = "../mailmate-test-support" }
tempfile = { workspace = true }

[[bin]]
name = "mailmate-native-host"
path = "src/main.rs"

[lib]
name = "mailmate_native_host"
path = "src/lib.rs"
