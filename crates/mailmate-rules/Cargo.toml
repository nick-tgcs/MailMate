[package]
name = "mailmate-rules"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

# Pure deterministic adapter implementing the RuleEngine port. Interprets the JSON-AST
# condition language with NO model inference (determinism-first). `regex` backs the one
# regex operator. `mailmate-core` never depends on this crate.
[dependencies]
mailmate-common = { path = "../mailmate-common" }
mailmate-ports = { path = "../mailmate-ports" }
async-trait.workspace = true
regex.workspace = true
serde_json.workspace = true

[dev-dependencies]
futures.workspace = true
