[package]
name = "mailmate-ai"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

# Edge adapter crate: the AiProvider port's concrete providers (mock + four HTTP adapters)
# plus the task schemas, structured validation, and the registry. Provider-specific detail
# never crosses this crate's boundary. The HTTP adapters talk to an `HttpClient` seam, not
# `reqwest` directly, so the default build/gate compiles and tests them with NO network and
# NO heavy HTTP/TLS dependency; the concrete reqwest transport is wired at the edge.
[dependencies]
mailmate-common = { path = "../mailmate-common" }
mailmate-ports = { path = "../mailmate-ports" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
futures.workspace = true
# For the "schema-valid but policy-invalid response rejected by a later layer" test.
mailmate-policy = { path = "../mailmate-policy" }
