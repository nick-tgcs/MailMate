[package]
name = "mailmate-workflow"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

# The follow-up workflow adapter crate: the pure cadence FSM (catch-up + coalescing +
# staleness guard) and the three engine adapters (DefaultWorkflowEngine,
# DefaultFollowUpScheduler, DefaultExitDetector) implementing the `mailmate-ports`
# WorkflowEngine / FollowUpScheduler / ExitDetector. It composes only PORTS (the workflow
# repositories, the reply-drafter, audit, clock); it names no backend, drives the existing
# review-required drafter (never a send), and `mailmate-core` never depends on it.
[dependencies]
mailmate-common = { path = "../mailmate-common" }
mailmate-ports = { path = "../mailmate-ports" }
async-trait.workspace = true
serde_json.workspace = true

[dev-dependencies]
mailmate-test-support = { path = "../mailmate-test-support" }
futures.workspace = true
serde_json.workspace = true
