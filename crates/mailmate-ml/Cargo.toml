[package]
name = "mailmate-ml"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

# `burn` is RESERVED: it swaps the in-process trainer's compute backend (and will back the
# discriminative Tier-2 classifier + in-process AiProvider) once an on-device LoRA adapter
# exists on Burn primitives. Phase 9 ships the `InProcessTrainer` — an honest small-model
# trainer that reports `lora: false` and needs no Burn, so the default build/gate stays
# light. Pulling the heavy `burn` tree is deferred until the LoRA target is real.
[features]
burn = []

[dependencies]
mailmate-common = { path = "../mailmate-common" }
mailmate-ports = { path = "../mailmate-ports" }
# The trainer-backend trait this crate's InProcessTrainer implements. mailmate-training is
# the trait-OWNER; the dependency points this way (impl -> trait), never the reverse.
mailmate-training = { path = "../mailmate-training" }
async-trait.workspace = true

[dev-dependencies]
futures.workspace = true
