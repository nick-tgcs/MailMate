[package]
name = "mailmate-ml"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

# Phase 8 makes `burn` the REAL default compute backend: the on-device Tier-2 classifier
# trainer (`tier2_burn`) trains a linear model by gradient descent on the CPU `ndarray`
# backend and writes a loadable Burn record the cascade loads and uses. CPU-only and no
# `train` (Learner) feature — we own the training loop — so the tree stays as small as a real
# autodiff framework allows. `mailmate-core` never sees this; only the ports cross the line.

[dependencies]
mailmate-common = { path = "../mailmate-common" }
mailmate-ports = { path = "../mailmate-ports" }
# The trainer-backend trait this crate's InProcessTrainer implements. mailmate-training is
# the trait-OWNER; the dependency points this way (impl -> trait), never the reverse.
mailmate-training = { path = "../mailmate-training" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
# Real on-device ML: CPU ndarray backend + reverse-mode autodiff + the record (de)serializer
# for the loadable artifact. No GPU/Learner/vision features — we hand-roll the training loop.
burn = { version = "0.21", default-features = false, features = ["std", "ndarray", "autodiff"] }

[dev-dependencies]
futures.workspace = true
