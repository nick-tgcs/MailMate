[package]
name = "mailmate-policy"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

# Pure deterministic adapter implementing the PolicyGuard port. No backend, no I/O — the
# hard policies are model-free rules (determinism-first). `mailmate-core` never depends on
# this crate; it is injected at the edge behind the port.
[dependencies]
mailmate-common = { path = "../mailmate-common" }
mailmate-ports = { path = "../mailmate-ports" }
async-trait.workspace = true

[dev-dependencies]
futures.workspace = true
serde_json.workspace = true
