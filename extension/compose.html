<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'"
    />
    <title>MailMate · Draft reply</title>
    <link rel="stylesheet" href="compose.css" />
  </head>
  <body>
    <header class="mm-head">
      <span class="mm-title">MailMate · Draft reply</span>
    </header>
    <!-- The "never sends" invariant is the first thing read, every time, and is not dismissible. -->
    <div class="mm-invariant">
      ⓘ This is a <strong>draft</strong>. MailMate never sends. Read it, adjust it, then use
      Thunderbird's own Send when you're ready.
    </div>
    <main id="mm-body" class="mm-body"></main>
    <script src="compose.js"></script>
  </body>
</html>
