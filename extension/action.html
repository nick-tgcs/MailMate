<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'" />
    <title>MailMate</title>
    <link rel="stylesheet" href="action.css" />
  </head>
  <body>
    <header class="mm-header">
      <span class="mm-title">MailMate</span>
      <span id="mm-dot" class="mm-dot mm-dot--connecting" aria-hidden="true"></span>

    </main>

    <footer id="mm-footer" class="mm-footer"></footer>

    <script src="action.js"></script>
  </body>
</html>
